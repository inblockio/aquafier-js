name: "Build Docker-Container"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  workflow_dispatch:
    
  push:
    branches:
      - main
      - dev
      - tracing
      # - playwright
      # - add-additional-tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set build info
        shell: bash
        run: |
          echo "{ \
          \"commitHash\": \"$(git rev-parse --short HEAD)\", \
           \"buildDate\": \"$(git log -1 --format='%cd' --date=local)\" \
           }" > ./web/src/version-info.json
      - name: build
        uses: ./.github/actions/build_container
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          push: true

  # Deployment is disabled. dev.inblock.io and aquafier.inblock.io are no longer
  # served, so these jobs would SSH into hosts that are gone. The image is still
  # built and pushed to ghcr.io above; only the rollout is switched off.
  #
  # To bring an environment back, uncomment the matching job below. The underlying
  # deploy-dev.yml / deploy-main.yml still exist and can also be run by hand via
  # workflow_dispatch.

