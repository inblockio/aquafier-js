minimumReleaseAge: 1440

# Security overrides — force minimum safe versions of transitive dependencies.
overrides:
  'ws@>=8.0.0 <8.17.1': '>=8.21.0'
  'systeminformation@<5.27.14': '>=5.27.14'
  '@isaacs/brace-expansion@5.0.0': '>=5.0.1'

# Trusted packages allowed to run install/build scripts.
# pnpm 11 blocks all dependency lifecycle scripts by default.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  '@sentry-internal/node-cpu-profiler': true
  'esbuild': true
  'protobufjs': true
minimumReleaseAgeExclude:
  # Renovate security update: ws@8.21.0
  - ws@8.21.0
