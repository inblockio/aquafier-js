minimumReleaseAge: 1440

# Security override — force a minimum safe version of ws.
overrides:
  'ws@>=8.0.0 <8.17.1': '>=8.21.0'

# Trusted packages allowed to run install/build scripts.
# pnpm 11 blocks all dependency lifecycle scripts by default.
allowBuilds:
  '@reown/appkit': true
  'bufferutil': true
  'esbuild': true
  'keccak': true
  'utf-8-validate': true
minimumReleaseAgeExclude:
  # Renovate security update: ws@8.21.0
  - ws@8.21.0
